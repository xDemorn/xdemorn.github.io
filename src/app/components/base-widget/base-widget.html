<header>
    <img [src]="this.data()?.icon" alt="App icon">
    <span>{{ this.data()?.name }}</span>
    <div class="actions">
        <button class="minimize" (click)="this.minimize()">&times;</button>
        <button class="maximize" (click)="this.maximize()">&times;</button>
        <button class="close" (click)="this.close()">&times;</button>
    </div>
</header>
<div class="content">
    <ng-content />
</div>
